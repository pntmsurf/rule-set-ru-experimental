name: Update Domain/IP Sources

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Fetch sources and update src/domains, src/ips
        working-directory: scripts/updater
        run: go run update_sources.go

      - name: Commit and push changes (if any)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: автообновление списков из источников"
          file_pattern: 'src/domains/*.txt src/ips/*.txt'
